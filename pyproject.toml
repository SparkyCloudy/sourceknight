[build-system]
requires = ["setuptools>=44", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "sourceknight"
version = "0.5.0"
description = "simple dependency manager for sourcemod projects"
readme = "README.md"
authors = [
    {name = "travis mick", email = "root@lo.calho.st"},
]
requires-python = ">=3.12"
dependencies = [
    "GitPython~=3.1.32",
    "pyyaml~=6.0.1",
    "requests~=2.32.5",
    "wget"
]

[project.optional-dependencies]
dev = [
    "mypy>=1.10.0",
    "ruff>=0.1.0",
    "types-PyYAML",
    "types-requests"
]


[project.urls]
Homepage = "https://github.com/SparkyCloudy/sourceknight"


[project.scripts]
sourceknight = "sourceknight.main:main"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM"]
ignore = ["SIM115", "E501", "B027"]

