name: 'Setup Sourceknight'
description: 'Set up Sourceknight build system and dependency manager for SourcePawn'
author: 'Sourceknight Maintainers'
branding:
  icon: 'package'
  color: 'blue'

inputs:
  sourceknight-version:
    description: 'Sourceknight package version to install'
    required: false
    default: '0.6.2'
  use-binary:
    description: 'Use ultra-fast standalone binary instead of Python pip (default: true)'
    required: false
    default: 'true'
  cache:
    description: 'Whether to enable dependency cache for .sourceknight/cache'
    required: false
    default: 'true'
  project-path:
    description: 'Path to directory containing sourceknight.yaml'
    required: false
    default: '.'

outputs:
  cache-hit:
    description: 'Whether the dependency cache was restored'
    value: ${{ steps.cache.outputs.cache-hit }}

runs:
  using: 'composite'
  steps:
    - name: Cache dependencies
      if: ${{ inputs.cache == 'true' }}
      id: cache
      uses: actions/cache@v4
      with:
        path: ${{ inputs.project-path }}/.sourceknight/cache
        key: sourceknight-${{ runner.os }}-${{ hashFiles(format('{0}/sourceknight.yaml', inputs.project-path)) }}
        restore-keys: |
          sourceknight-${{ runner.os }}-

    - name: Install Sourceknight
      shell: bash
      run: |
        VERSION="${{ inputs.sourceknight-version }}"
        [ -z "$VERSION" ] && VERSION="0.6.1"
        USE_BINARY="${{ inputs.use-binary }}"
        INSTALLED=0

        if [ "$USE_BINARY" = "true" ]; then
          if [ "${{ runner.os }}" = "Linux" ]; then
            echo "Fetching Sourceknight standalone binary for Linux x86_64 (v${VERSION})..."
            BIN_URL="https://github.com/SparkyCloudy/sourceknight/releases/download/${VERSION}/sourceknight-linux-x86_64"
            BIN_URL_V="https://github.com/SparkyCloudy/sourceknight/releases/download/v${VERSION}/sourceknight-linux-x86_64"
            
            mkdir -p "$HOME/.local/bin"
            if sudo curl -fsSL "$BIN_URL" -o /usr/local/bin/sourceknight 2>/dev/null || \
               sudo curl -fsSL "$BIN_URL_V" -o /usr/local/bin/sourceknight 2>/dev/null || \
               curl -fsSL "$BIN_URL" -o "$HOME/.local/bin/sourceknight" 2>/dev/null || \
               curl -fsSL "$BIN_URL_V" -o "$HOME/.local/bin/sourceknight" 2>/dev/null; then
              sudo chmod +x /usr/local/bin/sourceknight 2>/dev/null || chmod +x "$HOME/.local/bin/sourceknight"
              echo "$HOME/.local/bin" >> "$GITHUB_PATH"
              echo "Sourceknight standalone binary installed successfully."
              INSTALLED=1
            fi
          elif [ "${{ runner.os }}" = "Windows" ]; then
            echo "Fetching Sourceknight standalone binary for Windows x86_64 (v${VERSION})..."
            BIN_DIR="$RUNNER_TEMP/sourceknight/bin"
            mkdir -p "$BIN_DIR"
            BIN_URL="https://github.com/SparkyCloudy/sourceknight/releases/download/${VERSION}/sourceknight-windows-x86_64.exe"
            BIN_URL_V="https://github.com/SparkyCloudy/sourceknight/releases/download/v${VERSION}/sourceknight-windows-x86_64.exe"
            
            if curl -fsSL "$BIN_URL" -o "$BIN_DIR/sourceknight.exe" 2>/dev/null || \
               curl -fsSL "$BIN_URL_V" -o "$BIN_DIR/sourceknight.exe" 2>/dev/null; then
              echo "$BIN_DIR" >> "$GITHUB_PATH"
              echo "Sourceknight standalone binary installed successfully."
              INSTALLED=1
            fi
          fi
        fi

        if [ "$INSTALLED" -eq 0 ]; then
          echo "Installing Sourceknight via Python pip..."
          pip install --prefer-binary "https://github.com/SparkyCloudy/sourceknight/releases/download/${VERSION}/sourceknight-${VERSION}-py3-none-any.whl" || \
          pip install --prefer-binary "https://github.com/SparkyCloudy/sourceknight/releases/download/v${VERSION}/sourceknight-${VERSION}-py3-none-any.whl" || \
          pip install --prefer-binary "sourceknight==${VERSION}" || \
          pip install --prefer-binary git+https://github.com/SparkyCloudy/sourceknight.git
        fi
